# ============================================================================
#  INDICADORES ATIVOS  --  quais 6 indicadores compõem cada pergunta.
#
#  O painel calcula TODOS os indicadores do catálogo (src/catalogo.py) e guarda
#  na base. Este arquivo diz apenas QUAIS entram no score de cada eixo.
#
#  Para trocar um indicador:
#    1. substitua a chave na lista do eixo correspondente
#    2. salve e recarregue a página -- não precisa reiniciar nem recalcular nada
#
#  A troca também pode ser feita AO VIVO na barra lateral do painel, em
#  "Trocar indicadores", sem editar este arquivo. O que estiver aqui é o ponto
#  de partida de cada sessão.
#
#  REGRA DO TRABALHO: exatamente 6 por pergunta. O painel recusa listas com
#  tamanho diferente e avisa na tela.
#
#  As chaves disponíveis estão em src/catalogo.py e na aba de troca da barra
#  lateral, com a ficha de cada indicador (fonte, fórmula, unidade).
# ============================================================================

