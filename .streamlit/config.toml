# Tema do Streamlit -- espelha as cores base de src/tema.py.
# Para mudar a aparencia, edite ESTE arquivo e src/tema.py.
[theme]
base = "light"
primaryColor = "#8F6644"
backgroundColor = "#F3EFE5"
secondaryBackgroundColor = "#FAF8F2"
textColor = "#1A1D21"
font = "sans serif"

[server]
maxUploadSize = 5

[browser]
gatherUsageStats = false
