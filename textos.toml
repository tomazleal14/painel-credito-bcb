# ---------------------------------------------------------------------------
#  Secao final obrigatoria
# ---------------------------------------------------------------------------
[limites]
titulo = "O que este painel **não** permite concluir"
corpo = """
**1. Não identifica o tomador nem a safra.** O IF.data é trimestral e agregado por instituição.
Não se enxerga operação individual, nem safra (*vintage*), nem o devedor. A "inadimplência
ajustada ao crescimento" é uma aproximação do efeito denominador — **não** substitui uma
análise de safras, que exigiria o SCR operação a operação (dado protegido por sigilo bancário).

**2. Não mede concentração em poucos devedores.** O indicador P2 nº 5 usa a fatia da carteira
PJ em **tomadores de grande porte**, publicada diretamente pelo IF.data por instituição. Isso
mede exposição ao *segmento* de grandes tomadores — onde vive o risco de nome único —, mas
**não é um Herfindahl sobre devedores**: um banco com muitos clientes grandes aparece igual a
um com poucos. O SCR agregado publicado não divulga exposição por devedor, então concentração
em poucos nomes e verificação de limites de grandes exposições ficam fora do alcance do painel.
O indicador é **PJ-only**: instituições sem carteira PJ (emissores puros de cartão) ficam com
o campo vazio e não pontuam nesse item.

**2b. Não mede crescimento entre 2025Q1 e 2025Q4.** A Res. 4.966 mudou a conta do Resumo
em 01/2025: "Carteira de Crédito Classificada" virou "Carteira de Crédito", e não é só o
nome. Verificado no próprio painel, com universo constante: a carteira do Itaú salta de
R$ 1.088,0 bi para R$ 1.187,8 bi **em um trimestre** (+9,2%), enquanto o universo cresce
1,1%. Um degrau desse tamanho contamina toda comparação de 12 meses que o atravesse — e
chegou a marcar Itaú, Bradesco e BNDES como "risco alto de crescimento". Por isso os
indicadores que comparam com quatro trimestres antes ficam **vazios** nas data-bases
**2025Q1 a 2025Q4**. De 2026Q1 em diante a série volta a ser comparável.

**2c. P3 não existe antes de 2025.** Dos seis indicadores de deterioração, quatro
dependem do regime de perda esperada ou do relatório de capital, que só passam a existir
em 2025Q1 — sobram apenas provisão ÷ carteira e cobertura, duas medidas da mesma coisa.
O painel exige **metade dos indicadores** de um eixo para publicar seu score; abaixo
disso o eixo fica **vazio**, e a minissérie mostra uma lacuna em vez de uma linha. Antes,
um score de 2 indicadores em 6 era exibido como se fosse comparável aos demais. Pela
mesma regra, P1 não existe antes de 2020Q1 (crescimento precisa de quatro trimestres
anteriores).

**2d. Os três eixos não cobrem o mesmo período, e o score não tem sempre o mesmo
tamanho.** Esta é a limitação mais fácil de esquecer, porque não aparece como campo
vazio: aparece como um número que existe, mas foi calculado sobre uma base diferente da
do trimestre ao lado.

| eixo | trimestres com dado | de | janela | indicadores no score |
|---|---|---|---|---|
| P1 · Crescimento | 21 | 29 | 03/2020 a 03/2026, sem 2025 | 5 ou 6 |
| P2 · Concentração | 29 | 29 | 03/2019 a 03/2026 | 4 sempre |
| P3 · Deterioração | 5 | 29 | 03/2025 a 03/2026 | 5 ou 6 |

Três consequências práticas. (i) **Nenhuma comparação entre eixos ao longo do tempo** é
legítima: P3 tem cinco pontos e P2 tem vinte e nove. (ii) Dentro de P1, o score de 2022 é
média de **5** percentis e o de 2026 é média de **6** — a entrada de carteira ÷ capital
em 2024Q3, quando o Patrimônio de Referência passa a existir com quatro trimestres de
história, desloca o nível de todas as instituições ao mesmo tempo. É degrau de
composição, não de risco. (iii) Em P2 a série está completa e **ainda assim** tem quebra:
o patamar de 2022Q3 a 2024Q4 é o BNDES entrando no conjunto sinalizado, e o que mudou
nele foi um único percentil.

Por isso os cartões da **Visão geral descrevem apenas o trimestre selecionado** — a
composição da carteira por nível de risco, que está sempre completa. O histórico fica nas
páginas P1, P2 e P3, onde cada indicador traz a própria justificativa e o expander
*"Cobertura de cada indicador"* mostra, um a um, quantos trimestres ele cobre e por quê.
Reprodução: `src/checa_cobertura_ind.py`.

**3. Não compara 2024 com 2025 em qualidade de crédito.** A Res. CMN 4.966/2021 substituiu a
classificação AA–H por perda esperada em 01/01/2025, e os relatórios mudaram de universo
(tipo 1005 → 1009). A validação cruzada mostrou que a soma dos níveis E–H fica cerca de
**2,5 p.p. acima** da inadimplência de 90 dias. São conceitos distintos: o painel os mantém
separados e **não** traça uma linha contínua entre eles.

**4. Não afirma irregularidade, insolvência nem culpa.** O painel sinaliza **candidatos a exame**
segundo critérios públicos e explícitos. Crescer rápido não é infração; provisão baixa pode
refletir carteira legitimamente melhor. A conclusão é uma agenda de verificação, não um veredito.

**4b. O score não mede relevância sistêmica.** Ele mede **atipicidade dentro do grupo de pares**:
um score alto significa "muito fora do padrão do seu próprio tipo de instituição", não "importante
para o sistema". As duas coisas não coincidem — com uma lista única por score, os cinco maiores
bancos do país apareciam entre a 548ª e a 1046ª posição, e a agenda cobria 1% da carteira. Daí as
duas listas. Um score 0,75 num grupo de 154 cooperativas e um 0,75 num grupo de 66 bancos são o
quartil superior de populações diferentes e **não são diretamente comparáveis** entre si.

**5. Não enxerga o que não está no balanço.** Cessões de crédito, coobrigação, exposições fora
do balanço, risco de mercado e liquidez ficam fora do recorte destes relatórios.

**6. Não permite leitura regional de longo prazo.** O ESTBAN publica apenas os **últimos 6 meses**.
A concentração regional aqui é um corte transversal, não uma tendência. Além disso o ESTBAN
cobre só bancos comerciais e múltiplos com carteira comercial — não todo o SFN.

**7. Não é a carteira do SGS.** A carteira do IF.data é de 7% a 12% maior que a série SGS 20539,
por diferença de recorte (inclui arrendamento e outras operações com característica de crédito).
Os números **não** são intercambiáveis com as estatísticas monetárias e de crédito.

**8. Dados sujeitos a reapresentação.** O próprio IF.data adverte que, na data-base de dezembro,
os quatro trimestres anteriores são republicados com informações mais recentes. Os valores
podem mudar após a data de extração registrada nas notas de verificação.
"""
