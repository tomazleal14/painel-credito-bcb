[cabecalho]
titulo = "Painel decisório de crédito — Supervisão do Banco Central"
subtitulo = """
Quais instituições devem entrar na agenda de supervisão do próximo ciclo, dado o perfil de \
crescimento, concentração e potencial de deterioração da carteira?
"""
assinatura = "Trabalho Intermediário · FGV · Prof. Genaro Lins · **Grupo**: Tomaz Leal, Roberto Gomides e Diana Cabral"

[abas]
p1 = "P1 — Quais instituições crescem acima do sistema e da própria tendência?"
p2 = "P2 — Quais concentram a carteira em modalidades, regiões ou funding de risco?"
p3 = "P3 — Quem mostra deterioração incompatível com o ritmo de crescimento?"

[agenda]
titulo = "Agenda de supervisão"
leitura = """
Duas listas, porque são **duas perguntas diferentes**. *Atípicas no grupo de pares* reúne \
quem está muito fora do padrão do próprio tipo de instituição — entra por score acima do \
limiar. *Grandes com sinal* reúne as instituições que respondem pela maior parte da \
carteira: todas já estão na alçada da supervisão por tamanho, e ali o score define apenas \
a ordem em que se olha. Cada linha traz três luzes: crescimento, concentração e \
deterioração, sempre relativas ao grupo de pares.
"""
consequencia = """
Uma lista sozinha engana. Só com atipicidade, os cinco maiores bancos do país ficariam de \
fora da agenda — eles são medianos entre seus pares, mas qualquer deterioração ali é evento \
sistêmico. Só com tamanho, perde-se a cooperativa que cresce 165% ao ano. O limiar e a \
cobertura são ajustáveis na barra lateral, e mudar o critério é parte da decisão do \
supervisor.
"""

[comparador]
titulo = "Comparador de instituições"
leitura = "Os mesmos indicadores, lado a lado, para as instituições que você escolher."
consequencia = """
É aqui que se decide entre duas candidatas com score parecido: o score resume, o comparador \
mostra <i>por quê</i>.
"""

