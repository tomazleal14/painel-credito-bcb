[quebra.crescimento]
nota = """
**O score de P1 não tem sempre o mesmo tamanho.** Em 2019 só existem **2** indicadores —
abaixo do mínimo de 3, então o eixo não tem score. De 2020Q1 a 2024Q2 ele é a média de
