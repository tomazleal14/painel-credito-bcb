carteira ÷ capital. Em 2025 nenhum dos seis sobrevive à quebra da Res. 4.966, e o eixo
volta a ficar sem score.

A entrada do sexto indicador em 2024Q3 desloca o score de todas as instituições ao mesmo
tempo — é um **degrau de composição, não de risco**. Comparar o nível do score entre 2022
e 2026 exige lembrar que a régua mudou de tamanho no caminho. A seleção das instituições
do trimestre corrente não é afetada: ela usa só o corte transversal de 2026Q1, onde os
seis indicadores existem para todos.
"""

[quebra.concentracao]
nota = """
**O patamar entre 2022Q3 e 2024Q4 é uma única instituição: o BNDES.** Com R$ 325 bilhões
de carteira, ele sozinho responde por quase toda a diferença entre 0,7% e 5,4%. O que
mudou nele não foi concentração: foi a razão carteira ÷ captações passar de 1,10× para
1,18×, o suficiente para o percentil desse indicador ir de 0,50 a 1,00. Com três
indicadores válidos (o BNDES não tem carteira PF), o score foi de 0,583 para **exatamente
0,750** — o valor do corte. Em 2025 a razão cai para 0,66× na troca de universo e ele
volta a "atenção".

Duas lições que valem para todo o painel: com poucas instituições sinalizadas e
ponderação por tamanho, **uma sozinha move a série**; e um score que pousa exatamente no
corte torna a classificação sensível a variações mínimas.
"""

[quebra.deterioracao]
nota = """
A série cobre apenas 5 trimestres, então não há tendência a interpretar — só nível. A
