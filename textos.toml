[sintese]
titulo = "Os três eixos, e quanto da carteira cada um coloca em risco"

o_que_e_o_numero = """
O número grande é a **fatia da carteira do recorte que está em instituições sinalizadas
como risco alto naquele eixo**. Se aparece 7,2% em Crescimento, significa: somando a
carteira de todas as instituições que o painel marcou como risco alto de crescimento,
elas respondem por 7,2% do crédito do recorte. É percentual de carteira, não de
instituições — o selo ao lado traz a contagem (**54 de 258 IFs**).
"""

como_ler = """
Ele **pondera por tamanho**, e é por isso que serve à decisão: uma cooperativa de R$ 2
bilhões sinalizada não move o número; a Caixa sinalizada move muito. Nos últimos
trimestres a carteira exposta a risco de crescimento foi de 43% para 7% — esse tipo de
oscilação é o que se quer ver. As faixas usadas: **abaixo de 5%** é baixo, **5% a 20%**
é atenção, **acima de 20%** é alto.
"""

por_que_decompor = """
Quem define quais instituições são "risco alto" é o **score de posição relativa** (0 a 1),
em quatro passos: (1) o grupo de pares é o conjunto de instituições do mesmo TCB no
trimestre; (2) cada indicador do eixo vira um **percentil** dentro desse grupo; (3) a
**média desses percentis** é o score da instituição — indicador sem dado reduz o divisor,
não conta como zero; (4) score **≥ 0,75** entra como risco alto, e a carteira dela soma
no número de destaque. O score fica no rodapé do cartão e na agenda, mas não lidera:
